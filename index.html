let state={answers:{},index:0,brand:'',feedback:{}};let storageOK=true;try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&saved.version===VERSION){state={...state,...saved};state.index=Math.max(0,Math.min(23,Number(state.index)||0));state.answers=state.answers||{};}}catch{storageOK=false}
const app=document.querySelector('#app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify({...state,version:VERSION}));}catch{storageOK=false}}
function valid(q,a){return a==='unknown'||(q.options.length?q.options.some(o=>o[0]===a):Number.isInteger(a)&&a>=1&&a<=5)}
function calculate(answers){if(!QUESTIONS.every(q=>valid(q,answers[q.id])))throw Error('请完成全部24题');const scores=MAP.map(ids=>{const v=ids.map(id=>answers[id]).filter(x=>typeof x==='number');return v.length>=2?v.reduce((a,b)=>a+b,0)/v.length:null});const counts=NAMES.map((_,i)=>QUESTIONS.filter(q=>q.options.length&&answers[q.id]==='ABCDEF'[i]).length);const ranked=scores.map((v,i)=>({v,i})).filter(x=>x.v!==null).sort((a,b)=>b.v-a.v);const enough=scores.every(v=>v!==null);const flat=enough&&Math.abs(ranked[0].v-ranked[5].v)<1e-9;const major=enough&&!flat?ranked.filter(x=>Math.abs(x.v-ranked[0].v)<1e-9).map(x=>x.i):[];const rest=ranked.filter(x=>!major.includes(x.i));const companions=major.length===1&&rest.length?rest.filter(x=>Math.abs(x.v-rest[0].v)<1e-9).map(x=>x.i):[];const mean=enough?scores.reduce((a,b)=>a+b,0)/6:null;return {scores,counts,major,lead:major,companions,clear:major.length===1,status:!enough?'insufficient':flat?'undifferentiated':major.length===1?'single':'joint',relative:scores.map(v=>v===null||mean===null?null:v-mean),validScale:MAP.map(ids=>ids.filter(id=>typeof answers[id]==='number').length),scenarioValid:counts.reduce((a,b)=>a+b,0)};}
function button(label,fn,cls=''){const b=document.createElement('button');b.textContent=label;b.className=cls;b.onclick=fn;return b}
function home(){app.innerHTML='<p class="eyebrow">品牌生命系统 / 01</p><h1>看见品牌习惯的<br>做事方式。</h1><p>24道题，回顾品牌过去一年的真实经营行为。没有标准正确答案，请选择团队通常的做法。</p><div class="card"><b>18道量表 · 6道情境 · 六维观察</b><p>这是探索性未验证模型，尚未经过大样本心理测量验证。结果反映本次作答者的观察，不是组织客观诊断，也不是能力或成熟度评级。</p><label>品牌名称（选填）<input id="brand" maxlength="80" placeholder="也可以匿名作答"></label><div id="start" class="actions"></div></div>';document.querySelector('#brand').value=state.brand;document.querySelector('#start').append(button(Object.keys(state.answers).length?'继续测评':'开始测评',()=>{state.brand=document.querySelector('#brand').value.trim();save();question()},'primary'));if(QUESTIONS.every(q=>valid(q,state.answers[q.id])))document.querySelector('#start').append(button('用已有答案查看新版报告',()=>{state.brand=document.querySelector('#brand').value.trim();save();report()}));}
function question(){const q=QUESTIONS[state.index];const done=QUESTIONS.filter(q=>valid(q,state.answers[q.id])).length;app.innerHTML=`<p class="eyebrow">真实行为 / 过去一年</p><p>第 ${state.index+1} / 24 题 · 已作答 ${done} 题</p><progress max="24" value="${done}" aria-label="答题进度"></progress><div class="card"><h2 tabindex="-1">${esc(q.text)}</h2><p>${q.options.length?'请选择团队通常最先做的事，而不是最终会做的全部事情。':'请选择与实际经营行为的符合程度。'}</p><div class="options" role="radiogroup" aria-label="答案选项"></div><p id="error" role="alert" class="error"></p><div class="actions" id="nav"></div></div><small>${storageOK?'答案自动保存在当前浏览器。':'当前浏览器无法保存进度，请在离开前导出记录。'} 缺少实际经历时可选择“暂时无法判断”。</small>`;const options=q.options.length?q.options:[[1,'完全不像'],[2,'不太像'],[3,'有时候像'],[4,'比较像'],[5,'非常像']];for(const [v,t] of [...options,['unknown','暂时无法判断']]){const b=button(`${v==='unknown'?'':v+' · '}${t}`,()=>{state.answers[q.id]=v;save();question()});b.setAttribute('role','radio');b.setAttribute('aria-checked',String(state.answers[q.id]===v));document.querySelector('.options').append(b)}const nav=document.querySelector('#nav');if(state.index>0)nav.append(button('上一题',()=>{state.index--;save();question()}));nav.append(button(state.index===23?'生成报告':'下一题',()=>{if(!valid(q,state.answers[q.id])){document.querySelector('#error').textContent='请选择一个答案，也可选择暂时无法判断。';return}if(state.index<23){state.index++;save();question();app.querySelector('h2').focus()}else{const missing=QUESTIONS.find(q=>!valid(q,state.answers[q.id]));if(missing){state.index=missing.id-1;question();return}state.submittedAt=new Date().toISOString();save();report()}},'primary'));nav.append(button('导出当前记录',()=>download()));}
function payload(){let result=null;try{result=calculate(state.answers)}catch{}return {assessment_version:VERSION,report_version:RULE_VERSION,result_rule_version:RULE_VERSION,exported_at:new Date().toISOString(),submitted_at:state.submittedAt||null,brand:state.brand,answers:Object.fromEntries(QUESTIONS.map(q=>['Q'+q.id,state.answers[q.id]??null])),result,feedback:state.feedback,model_status:'探索性未验证模型'}}
function download(){const url=URL.createObjectURL(new Blob([JSON.stringify(payload(),null,2)],{type:'application/json;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='brand-mbti-results-1.2.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function report(){const r=calculate(state.answers),m=lifeModel(r);const list=ids=>ids.map(i=>NAMES[i]).join('、');const sufficient=r.status!=='insufficient';const intro=r.status==='insufficient'?'部分维度的有效观察不足，当前不进行完整人格排序。':r.status==='undifferentiated'?'六维同分，当前作答没有呈现可区分的主要倾向。':'这里的主要倾向指本次作答中并列最高的维度，不是经过统计验证的固定分类。';const paragraphs=key=>m.ids.map(i=>`<p>${m.ids.length>1?'<b>'+NAMES[i]+'：</b>':''}${LIFE[i][key]}</p>`).join('');const block=(n,t,c)=>`<section><p class="eyebrow">0${n} / LIFE</p><h2>${t}</h2>${c}</section>`;const fallback='<p>请回顾一个真实项目：团队先注意到什么、如何决定做什么、实际反馈又改变了什么。当前资料不支持指定人格，但仍可以用这个过程认识品牌的运行方式。</p>';const top=r.scenarioValid?NAMES.filter((_,i)=>r.counts[i]===Math.max(...r.counts)).join('、'):'';const graph=NAMES.map((n,i)=>`<div class="row"><span>${n}</span><div class="track"><div class="fill" style="width:${(r.scores[i]??0)/5*100}%"></div></div><b>${r.scores[i]===null?'不足':r.scores[i].toFixed(2)}</b></div>`).join('');app.innerHTML=`<p class="eyebrow">品牌生命观察 / 题库1.0 · 报告1.2</p><h1>${esc(state.brand||'你的品牌')}<br>如何持续生长</h1><p>当前主要倾向：<b>${m.names||'尚未形成可区分的画像'}</b>${r.companions.length?'<br>伴随人格：'+list(r.companions):''}</p><p class="note">${intro} 探索性未验证模型；反映作答者观察，不衡量品牌能力或成熟度。</p>`+
block(1,'人格宣言',m.ids.length===1?`<h3>${LIFE[m.ids[0]].declaration}</h3>`:m.ids.includes(2)&&m.ids.includes(4)?'<h3>让想法经过真实尝试，也让值得做的事情拥有持续下去的条件。</h3>':m.ids.length?paragraphs('declaration'):'<h3>从真实创造中，认识品牌自己的生长方式。</h3>')+
block(2,'你眼中的世界',paragraphs('world')||fallback)+
block(3,'你如何做出选择',`<p>${m.integration}</p>`+paragraphs('choice')+(top?`<p>在本次假设情境中，${top}对应的做法被较常优先选择。这提醒我们留意：日常习惯之外，具体取舍也可能从不同入口启动；它不会改变量表排序，也不能被当成已经发生的经营事实。</p>`:''))+
block(4,'你独特的生命力',(paragraphs('strength')||fallback)+'<p>品牌的积累可以是在同一品类中不断做深，也可以是寻找新的载体。关键是不同尝试是否围绕值得持续创造的价值，并把反馈带回下一轮行动。</p>')+
block(5,'你是否经常这样',`<p>以下是帮助识别倾向的示例，并非对品牌历史的断言。</p>`+(m.ids.length?m.ids.map(i=>`<h3>${NAMES[i]}</h3><ul>${LIFE[i].scenes.map(s=>'<li>'+s+'</li>').join('')}</ul>`).join(''):fallback))+
block(6,'值得留意的另一面',(paragraphs('risk')||'<p>不要把缺少可区分倾向理解为品牌没有特点。可以先确认作答者是否熟悉相关场景，以及题目是否准确表达了真实做法。</p>')+'<p>这些是发展中值得观察的可能张力，不能直接当作已确认的结构问题。当前问卷没有测量商业模型是否成立，也没有测量核心价值是否清晰。</p>')+
block(7,'让自己更好地生长',(paragraphs('growth')||fallback)+`<h3>下一轮生长，先问什么？</h3>${m.ids.map(i=>'<p>'+LIFE[i].question+'</p>').join('')}<p>选择一个项目，同时记录：希望持续创造的价值、承载它的产品或体验、用户与商业反馈，以及项目结束后希望留下的认识或能力。用这些实际记录检验画像是否适合自己。</p>`)+
`<section><h2>测评依据与完整记录</h2><p>题库1.0 · 结果规则1.2 · 报告1.2<br>提交时间：${esc(state.submittedAt||'未记录')}</p><p>六维均分仅为描述性观察。量表与情境分开统计，不加权合并；没有3.5或0.4分类门槛。主要倾向取六维有效时的最高分，精确同分全部保留；六维全同分不指定类型。仅单一最高时，列次高及其并列为伴随人格。排序不代表差异具有统计意义。</p><p>相对分值为各维均分减去本品牌六维平均，不改变排序，不是百分位、概率或品牌之间的比较；它不能提高原问卷的测量精度。</p><details><summary>查看六维画像与独立情境统计</summary>${graph}<table><thead><tr><th>维度</th><th>相对自身平均</th><th>情境次数</th></tr></thead><tbody>${NAMES.map((n,i)=>`<tr><td>${n}</td><td>${r.relative[i]===null?'不足':r.relative[i].toFixed(2)}</td><td>${r.counts[i]}</td></tr>`).join('')}</tbody></table><p>各维有效量表题：${r.validScale.join(' / ')}；有效情境题：${r.scenarioValid}/6。无法判断不记作中间分。每维至少2题有效才计分；${sufficient?'六维有效。':'部分维度不足，不进行完整排序。'}</p></details><details><summary>查看24题原始答案</summary>${QUESTIONS.map(q=>`<p>Q${q.id} ${esc(q.text)}<br>${esc(state.answers[q.id]==='unknown'?'暂时无法判断':state.answers[q.id])}</p>`).join('')}</details><p>本报告借鉴生命力品牌创造法中的“价值—载体—反馈—积累—生长”关系作为解释框架；不从人格分数推断Soul等结构维度的高低，不自动触发品牌结构诊断。</p></section>`+
`<section id="feedback"><h2>这份画像对你有帮助吗？</h2><p>反馈仅保存在本机，需保存后导出分享。</p><label>反映真实经营的程度<select id="rating"><option value="">请选择</option>${[1,2,3,4,5].map(n=>'<option>'+n+'</option>').join('')}</select></label><label>哪些描述最像你们？<textarea id="accurate" maxlength="3000"></textarea></label><label>哪些描述不像，或哪些题目难以判断？<textarea id="inaccurate" maxlength="3000"></textarea></label><button id="saveFeedback">保存反馈</button><p id="status" role="status"></p></section><div class="actions" id="tools"></div>`;for(const id of ['rating','accurate','inaccurate'])document.getElementById(id).value=state.feedback[id]||'';document.querySelector('#saveFeedback').onclick=()=>{state.feedback=Object.fromEntries(['rating','accurate','inaccurate'].map(id=>[id,document.getElementById(id).value]));save();document.querySelector('#status').textContent=storageOK?'反馈已保存，可下载或复制分享。':'无法保存到本机，请立即下载记录。'};document.querySelector('#tools').append(button('下载数据',download),button('复制数据',async()=>{try{await navigator.clipboard.writeText(JSON.stringify(payload(),null,2));alert('已复制')}catch{alert('复制未成功，请下载数据。')}}),button('打印 / 保存PDF',()=>window.print()),button('修改答案',()=>{state.index=0;question()}),button('重新开始',()=>{if(confirm('清除本机本次答案和反馈？')){try{localStorage.removeItem(KEY)}catch{}state={answers:{},index:0,brand:'',feedback:{}};home()}}));}
